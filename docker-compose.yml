## version attribute is obsolete in recent Docker Compose, removed for clarity
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: openasm_app:1.1.0
    container_name: openasm_app
    restart: always
    logging: *default-logging
    expose:
      - "3000"
    env_file:
      - .env.docker
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    # Database migrations run before the app on every start (no-op when up to
    # date): schema on first install, pending migrations/versions/* files,
    # default data and the initial admin account. If they fail the app does
    # not start — see `docker compose logs app`. Details: migrations/README.md
    command: sh -c "node migrations/migrate.js up && exec npm start"
    networks:
      - openasm_net
  db:
    image: postgres:15
    container_name: openasm_db
    restart: always
    logging: *default-logging
    env_file:
      - .env.docker
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - openasm_net
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openasm_pgadmin
    restart: always
    logging: *default-logging
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123321
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "8888:80"
    depends_on:
      - db
    networks:
      - openasm_net
  nginx:
    image: nginx:1.29.0
    container_name: openasm_nginx
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./ssl/nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key:ro
    depends_on:
      - app
    networks:
      - openasm_net
## Removed db_data volume, now using bind mount ./pgdata for Postgres data
networks:
  openasm_net:
    driver: bridge

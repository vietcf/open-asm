## version attribute is obsolete in recent Docker Compose, removed for clarity
# Container logs (docker compose logs): at most max-size x max-file per
# container (here 30 MB, older files gzip-compressed), so they never fill the
# disk. The app writes its audit / application log there too, one JSON line
# per event (README: Logs and Monitoring, forwarding to a SIEM).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  app:
    build: .
    image: openasm_app:1.8.11
    container_name: openasm_app
    restart: always
    logging: *default-logging
    expose:
      - "3000"
    # docker/defaults.env makes this work with zero configuration;
    # .env.docker (optional, see .env.docker.sample) overrides any value.
    env_file: &app_env
      - path: docker/defaults.env
        required: true
      - path: .env.docker
        required: false
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
      - ./data:/app/data   # generated secrets + initial admin password file
      - ./ssl:/app/ssl     # TLS certificate shared with nginx
    depends_on:
      db:
        condition: service_healthy
    # The image entrypoint (docker/entrypoint.sh) runs before the app on every
    # start: generates secrets/certificate on first start, then database
    # migrations (no-op when up to date). If they fail the app does not start
    # - see `docker compose logs app`. Details: migrations/README.md
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - openasm_net
  db:
    image: postgres:15
    container_name: openasm_db
    restart: always
    logging: *default-logging
    env_file: *app_env
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"   # host-local only; remove the 127.0.0.1: prefix to expose it
    networks:
      - openasm_net
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openasm_pgadmin
    restart: always
    logging: *default-logging
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123321
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "8888:80"
    depends_on:
      - db
    networks:
      - openasm_net
  nginx:
    image: nginx:1.29.0
    container_name: openasm_nginx
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - openasm_net
## Removed db_data volume, now using bind mount ./pgdata for Postgres data
networks:
  openasm_net:
    driver: bridge
